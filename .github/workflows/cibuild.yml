name: CI Build
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - 'docs/**'
      - '.github/**/*docs*'
      - '.github/**/*codeql*'
      - '.github/*.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/**/*docs*'
      - '.github/**/*codeql*'
      - '.github/*.yml'

env:
  LC_ALL: en_US.UTF-8
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryHandler.count=3

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        java: ['17', '21', '25']
        include:
          - java: '17'
            run-tests: true
          - java: '21'
            run-tests: false
          - java: '25'
            run-tests: true
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Tests
        if: matrix.run-tests
        run: >-
          ./mvnw --batch-mode --no-transfer-progress install
          -Dbnd.testing.skip=true
          -pl '!org.eclipse.osgitech.rest.tck,!org.eclipse.osgitech.rest.servlet.whiteboard.tests,!org.eclipse.osgitech.rest.tests'

      - name: Build without Tests
        if: ${{ !matrix.run-tests }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress install
          -DskipTests
          -Dbnd.testing.skip=true
          -pl '!org.eclipse.osgitech.rest.tck,!org.eclipse.osgitech.rest.servlet.whiteboard.tests,!org.eclipse.osgitech.rest.tests'
