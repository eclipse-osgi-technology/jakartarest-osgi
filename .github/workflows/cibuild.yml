name: CI Build
on:
  push:
    branches-ignore:
    - 'dependabot/**'
    paths-ignore:
    - 'docs/**'
    - '.github/**/*docs*'
    - '.github/**/*codeql*'
    - '.github/*.yml'
  pull_request:
    paths-ignore:
    - 'docs/**'
    - '.github/**/*docs*'
    - '.github/**/*codeql*'
    - '.github/*.yml'

env:
  LC_ALL: en_US.UTF-8
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryHandler.count=3

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        java:
        - '17'
        - '21'
        - '25'
        os:
        - 'ubuntu-latest'
        include:
        - os: 'windows-latest'
          java: '17'
    name: JDK${{ matrix.java }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit

    - name: Git Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Java ${{ matrix.java }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: maven
    - name: Build Maven
      run: |
        ./.github/scripts/build.sh

  # main: deploys the SNAPSHOT to Central snapshots.
  # release: deploys the version without -SNAPSHOT to Central, tags it as
  # v<version> and opens a pull request bumping main to the next patch SNAPSHOT.
  deploy:
    needs: build
    if: >-
      github.repository == 'eclipse-osgi-technology/jakartarest-osgi'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
      && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit

    - name: Verify deployment secrets are configured
      run: |
        MISSING=""
        if [[ -z "${SECRET_GPG_KEY}" ]]; then MISSING="${MISSING} GPG_PRIVATE_KEY"; fi
        if [[ -z "${SECRET_GPG_PASS}" ]]; then MISSING="${MISSING} GPG_PASSPHRASE"; fi
        if [[ -z "${SECRET_SONATYPE_USER}" ]]; then MISSING="${MISSING} CENTRAL_SONATYPE_TOKEN_USERNAME"; fi
        if [[ -z "${SECRET_SONATYPE_PASS}" ]]; then MISSING="${MISSING} CENTRAL_SONATYPE_TOKEN_PASSWORD"; fi
        if [[ -n "${MISSING}" ]]; then
          echo "::error::Missing required deployment secrets:${MISSING}"
          exit 1
        fi
      env:
        SECRET_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        SECRET_GPG_PASS: ${{ secrets.GPG_PASSPHRASE }}
        SECRET_SONATYPE_USER: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
        SECRET_SONATYPE_PASS: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
    - name: Install gpg secret key
      run: |
        cat <(echo -e "${{ secrets.GPG_PRIVATE_KEY }}") | gpg --batch --import
        gpg --list-secret-keys --keyid-format LONG
    - name: Git Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: maven
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-passphrase: PASSPHRASE
    - name: Determine version
      id: version
      run: |
        REVISION=$(./mvnw -B -q help:evaluate -Dexpression=revision -DforceStdout)
        echo "Project revision: ${REVISION}"
        if [[ "${REVISION}" != *-SNAPSHOT ]]; then
          echo "::error::revision must be a SNAPSHOT version, but found: ${REVISION}"
          exit 1
        fi
        if [[ "${GITHUB_REF}" == "refs/heads/release" ]]; then
          VERSION="${REVISION%-SNAPSHOT}"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]]; then
            echo "::error::Tag v${VERSION} already exists, bump the revision on main first"
            exit 1
          fi
        else
          VERSION="${REVISION}"
        fi
        echo "Deploying version: ${VERSION}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Deploy
      run: |
        ./mvnw -B --no-transfer-progress -Pdeploy clean deploy -Drevision=${{ steps.version.outputs.version }}
      env:
        MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
        PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    - name: Tag release
      if: github.ref == 'refs/heads/release'
      run: |
        VERSION=${{ steps.version.outputs.version }}
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v${VERSION}" -m "Release ${VERSION}"
        git push origin "v${VERSION}"
    - name: Open pull request to bump main
      if: github.ref == 'refs/heads/release'
      run: |
        VERSION=${{ steps.version.outputs.version }}
        IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION}"
        NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
        BRANCH="bump/${NEXT}"
        git fetch origin main
        git switch -c "${BRANCH}" origin/main
        sed -i "s|<revision>${VERSION}-SNAPSHOT</revision>|<revision>${NEXT}</revision>|" pom.xml
        if git diff --quiet; then
          echo "::notice::main is not on ${VERSION}-SNAPSHOT anymore, no bump needed"
          exit 0
        fi
        git commit -am "Bump version to ${NEXT}"
        git push origin "${BRANCH}"
        gh pr create --base main --head "${BRANCH}" \
          --title "Bump version to ${NEXT}" \
          --body "Version ${VERSION} was released and tagged as v${VERSION}."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
